[project]
name = "lavender-report"
version = "0.1.0"
description = "Command-line tool for effortless VAT reporting with Stripe—tailored for EU businesses."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.1.0",
    "pytz>=2025.2",
    "stripe>=12.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9/F) plus import sorting. The datetime-tz
# rules (DTZ) are deliberately not enabled: naive datetimes are used on
# purpose (local default reporting period; the report window itself is
# converted via pytz Europe/Paris).
select = ["E4", "E7", "E9", "F", "I"]
