name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # setup-uv publishes only full semver tags, no moving major tag
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Byte-compile
        run: uv run python -m py_compile main.py report_csv.py report_html.py
